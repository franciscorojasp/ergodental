<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA & Mobile Web App Manifest -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    
    <!-- Cross-Platform Browser Colors -->
    <meta name="theme-color" content="#040610" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#040610" />
    <meta name="msapplication-TileColor" content="#040610" />
    <meta name="application-name" content="Ergodentalve" />

    <!-- Android, HarmonyOS & Chromium Enhancements -->
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png" />

    <meta name="format-detection" content="telephone=no" />
